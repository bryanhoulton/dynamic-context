[project]
name = "dynamic-context"
version = "0.1.0"
description = "Experiments in changing model context during memory retrieval and live speech"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "modal>=1.3.0.post1",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "supermemory==3.34.0",
    "fastapi>=0.111",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dynamic_context"]
